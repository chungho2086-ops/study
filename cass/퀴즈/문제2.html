<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 + 텍스트 박스</title>
    <link rel="stylesheet" href="../asset/css/08_style.css">
    <style>
        div{
            border: 1px solid red;
        }
        .wrapper {
            width: 800px;
            margin: 0 auto;
        }
        .wrapper .left, .wrapper .right {
            display: inline-block;
            box-sizing: border-box;
            /*width: 400px; */
            width: 50%;
        }
        .wrapper .right {
            margin-left: -4px;
        }

        .wrapper .left img {
            width: 400px;
        }

        .wrapper .left img {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="left">
            <img src="https://nicepage.com/css-templates/preview/editor-in-chief-interview-196735?device=desktop"> 
    </div>       
     
</body>
</html>

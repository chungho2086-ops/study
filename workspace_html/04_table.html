<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 테이블-->
    <table border="1">
        <!-- tr : table row 한줄을 뜻함 -->
        <tr>
            <td>내용1-1</td>
            <td>내용1-2</td>
            <td>내용1-3</td>
        </tr>
        <tr>
            <td>내용2-1</td>
            <td>내용2-2</td>
            <td>내용2-3</td>
        </tr>

         
    <table border="1">
        
        <tr>
            <th>내용1-1</th>
            <th>내용1-2</th>
            <th>내용1-3</th>
        </tr>
        <tr>
            <th>내용2-1</th>
            <th>내용2-2</th>
            <th>내용2-3</th>
        </tr>

        <table border="1">
        
        <tr>
            <!--
               th : table header 컬럼의 제목
               두꺼은 글씨로 상하좌우 정렬
               -->
            <th>내용1-1</th>
            <th>내용1-2</th>
            <th>내용1-3</th>
        </tr>
        <tr>
            <td>
                내용2-111111111111111
            </td>
            <td>내용2-22222222222</td>
            <td>내용2-33333333333</td>
            <td>내용2-4</td>
        </tr>
    </table>

    <tr>
        <table border="1">

        <td>천안</td>
        <td>3명</td>
        <td> 5000원</td>
        <tr>

        <td>평택</td>
        <td>5명</td>
        <td>12000원</td>

    </tr>
    <table>

        <hr>
        <h1>테이블의 정석 구성</h1>
        <table border="1">

            <caption>테이블 내용에 대한 설명</caption>
            <summary>제목1, 제목2 (컬럼 나열)</summary>

            <thead>
            <tr>
                <th> 제목1</th>
                 <th> 제목2</th>
             </tr>
             </thead>

             <td> 내용1</td>  
             <td> 내용2</td> 
             </tr> 
                  <td> 내용1</td>
                  <td> 내용2</td>
            </tr>
        </tbody>
<hr>
     <table>
        <tr>
            <th width="200" height="100">제목</th>
        </tr>
        <tr>
            <td width="200" height="100">제목</td>
        </tr>
     </table>
     <!-- tr*2>td*3  -->
     <table border="1">
     <tr>
        <td rowspan="2">1-1</td>
        <td colspan="2">1-2</td>
        <!-- <td>1-3<td> -->
     </tr>
     <tr>
         <!-- <td>2-1<td> -->
        <td>2-2</td>
        <td>2-3</td>
  </tr>
     </table>

     
                 
</body>
</html>

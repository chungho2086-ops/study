<!DOCTYPE html>

<body>

<h2>덧셈 계산기</h2>

<!-- form : 서버로 값 보내는 역할 -->
<form action="calc" method="get">

    <!-- 첫 번째 숫자 -->
    <input type="text" name="num1">

    +

    <!-- 두 번째 숫자 -->
    <input type="text" name="num2">

    <!-- 버튼 -->
    <input type="submit" value="더하기">

</form>

</body>
